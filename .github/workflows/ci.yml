name: CI & Publish

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@main
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install uv
        uses: astral-sh/setup-uv@main
        
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
        
      - name: Install dependencies and build extension
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run Pytest
        run: uv run --python ${{ matrix.python-version }} pytest test_rendering.py -v

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    # Run the wheel builder on release publishes or pushes to main for TestPyPI
    if: (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@main

      - name: Set up Pythons
        uses: actions/setup-python@main
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
            3.15

      - name: Build wheels
        uses: PyO3/maturin-action@main
        with:
          args: --release --out dist -i 3.10 3.11 3.12 3.13 3.14 3.15

      - name: Upload wheels
        uses: actions/upload-artifact@main
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  test-publish:
    name: Test Publish to TestPyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/markdown-katex-rs
    permissions:
      id-token: write
      contents: read
    
    steps:
      - uses: actions/download-artifact@main
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
          
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish:
    name: Publish to PyPI
    needs: build-wheels
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment:
      name: pypi
      url: https://pypi.org/p/markdown-katex-rs
    permissions:
      id-token: write  # required for trusted publishing
      contents: read
    
    steps:
      - uses: actions/download-artifact@main
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
          
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
